# Docker Compose for the local PostgreSQL databases.
#
#   docker compose up -d --wait db                       # application database
#   docker compose --profile test up -d --wait db_test   # test database
#
# Credentials and ports come from the project-root `.env` file (created by
# `python setup_env.py`). Both databases are published on 127.0.0.1 only, so
# they are reachable from this machine but not exposed to the network.

name: gainmiles-test

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gainmiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gainmiles}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db_test:
    image: postgres:18.6
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gainmiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-gainmiles_test}
    ports:
      - "127.0.0.1:${DB_TEST_HOST_PORT:-55433}:5432"
    volumes:
      - db_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_TEST_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  db_test_data:
