# Alembic configuration.
#
# The database URL is intentionally left empty: migrations/env.py loads
# DATABASE_URL from the project-root .env file, so no credential is ever stored
# in this tracked file. Tests point Alembic at TEST_DATABASE_URL instead.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
